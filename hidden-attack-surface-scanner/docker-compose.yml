version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hass-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hass
      POSTGRES_USER: hass
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hass"]
      interval: 5s
      timeout: 3s
      retries: 10

  scanner:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: everywhere-cli
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hass
      DB_USER: hass
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      INTERACTSH_SERVER: ${INTERACTSH_SERVER:-}
      INTERACTSH_TOKEN: ${INTERACTSH_TOKEN:-}
    stdin_open: true
    tty: true
    volumes:
      - ./configs:/app/configs:ro
      - /opt/everywhere-data:/data
    command: [
      "-config", "/data/config.yaml",
      "-payloads", "/app/configs/injections.yaml",
      "-targets-file", "/data/targets.txt",
      "-mode", "quick",
      "-batch-size", "1500",
      "-rate-limit", "20",
      "-callback-timeout", "1440"
    ]

volumes:
  pg_data:
